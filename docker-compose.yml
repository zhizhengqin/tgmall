version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tgmall-postgres
    environment:
      POSTGRES_USER: tgmall
      POSTGRES_PASSWORD: tgmall_dev
      POSTGRES_DB: tgmall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tgmall-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
