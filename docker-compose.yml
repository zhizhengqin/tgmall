version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tgmall-postgres
    environment:
      POSTGRES_USER: tgmall
      POSTGRES_PASSWORD: tgmall_dev
      POSTGRES_DB: tgmall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tgmall-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build: ./tgmall-api
    container_name: tgmall-api
    ports:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      BAKONG_WEBHOOK_SECRET: ${BAKONG_WEBHOOK_SECRET}
      ABA_PAY_SECRET: ${ABA_PAY_SECRET}
      WING_PAY_SECRET: ${WING_PAY_SECRET}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: tgmall-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tgmall-merchant/dist:/usr/share/nginx/html/merchant:ro
      - ./tgmall-admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
