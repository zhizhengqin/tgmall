<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TG Mall — ការបញ្ជាទិញ</title>
  <style>
    :root {
      --bg:        oklch(98.5% 0.003 95);
      --surface:   oklch(100% 0 0);
      --fg:        oklch(20% 0.015 80);
      --muted:     oklch(50% 0.012 80);
      --border:    oklch(90% 0.005 95);
      --accent:    oklch(64% 0.16 82);
      --accent-red: oklch(52% 0.20 24);
      --accent-green: oklch(58% 0.16 155);
      --accent-blue: oklch(58% 0.16 255);
      --font-khmer: 'Noto Sans Khmer', 'Khmer OS', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --radius-sm: 8px; --radius-md: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }
    body.lang-km { font-family: var(--font-khmer); }

    .top-bar {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      width: 36px; height: 36px;
      border: none; background: var(--bg);
      border-radius: 50%; cursor: pointer;
      display: grid; place-items: center;
      font-size: 18px; color: var(--fg);
    }
    .top-bar h1 { font-size: 15px; font-weight: 600; flex: 1; }
    .lang-switch {
      display: flex; gap: 2px;
      background: var(--bg); border-radius: var(--radius-sm);
      padding: 2px; border: 1px solid var(--border);
    }
    .lang-switch button {
      width: 32px; height: 26px;
      border: none; background: transparent;
      border-radius: 6px; font-size: 11px; font-weight: 600;
      cursor: pointer; color: var(--muted);
    }
    .lang-switch button.active { background: var(--accent); color: #fff; }

    /* Status tabs */
    .status-tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      position: sticky; top: 56px; z-index: 99;
    }
    .status-tabs::-webkit-scrollbar { display: none; }
    .status-tab {
      flex-shrink: 0;
      padding: 12px 18px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .status-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 700;
    }
    .status-tab .count {
      background: var(--bg);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 4px;
    }
    .status-tab.active .count {
      background: oklch(64% 0.16 82 / 0.12);
    }

    /* Order cards */
    .order-list { padding: 10px 16px; }
    .order-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .order-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .order-id {
      font-family: ui-monospace, monospace;
      color: var(--muted);
      font-size: 11px;
    }
    .order-status {
      font-weight: 600; font-size: 12px;
      padding: 3px 10px; border-radius: 999px;
    }
    .status-pending_payment { background: oklch(60% 0.15 60 / 0.12); color: oklch(55% 0.14 65); }
    .status-confirmed { background: oklch(58% 0.16 200 / 0.1); color: oklch(50% 0.14 205); }
    .status-paid { background: oklch(58% 0.16 255 / 0.1); color: var(--accent-blue); }
    .status-shipped { background: oklch(58% 0.16 155 / 0.1); color: var(--accent-green); }
    .status-completed { background: oklch(50% 0.01 80 / 0.08); color: var(--muted); }
    .status-cancelled { background: oklch(52% 0.20 24 / 0.08); color: var(--accent-red); }

    .order-items { padding: 10px 14px; }
    .order-item {
      display: flex; gap: 10px; padding: 6px 0;
    }
    .order-item-img {
      width: 56px; height: 56px;
      border-radius: var(--radius-sm);
      background: oklch(95% 0.003 90);
      display: grid; place-items: center;
      font-size: 24px; flex-shrink: 0;
    }
    .order-item-info { flex: 1; min-width: 0; }
    .order-item-name { font-size: 13px; line-height: 1.4; }
    .order-item-spec { font-size: 11px; color: var(--muted); }
    .order-item-price { font-weight: 700; font-size: 14px; color: var(--accent-red); text-align: right; }

    .order-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    .order-total { font-weight: 700; font-size: 14px; }
    .order-actions { display: flex; gap: 8px; }
    .order-btn {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; border: none;
      transition: all 0.15s;
    }
    .order-btn:active { transform: scale(0.96); }
    .btn-primary-o {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn-danger-o {
      background: transparent;
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
    }
    .btn-fill {
      background: var(--accent);
      color: #fff;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 80px 20px;
    }
    .empty-state .icon { font-size: 56px; margin-bottom: 12px; }
    .empty-state p { color: var(--muted); font-size: 14px; }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: min(430px, 100%);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 6px 0 env(safe-area-inset-bottom, 8px);
      z-index: 200;
    }
    .bottom-nav .nav-item {
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 6px 0;
      cursor: pointer; color: var(--muted);
      text-decoration: none; font-size: 10px; font-weight: 500;
    }
    .bottom-nav .nav-item.active { color: var(--accent); }
    .bottom-nav .nav-item svg { width: 22px; height: 22px; }

    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: oklch(20% 0.02 80); color: #fff;
      padding: 10px 20px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 999;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
  </style>
</head>
<body class="lang-km">
  <div class="toast" id="toast"></div>

  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1 data-i18n="title">ការបញ្ជាទិញរបស់ខ្ញុំ</h1>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="km" class="active">ប្រ</button>
      <button data-lang="zh">中</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <!-- Status tabs -->
  <div class="status-tabs" id="statusTabs">
    <div class="status-tab active" data-status="all">
      <span data-i18n="all">ទាំងអស់</span> <span class="count" id="countAll">4</span>
    </div>
    <div class="status-tab" data-status="pending_payment">
      <span data-i18n="pending">មិនទាន់បង់</span> <span class="count" id="countPending">1</span>
    </div>
    <div class="status-tab" data-status="confirmed">
      <span data-i18n="confirmed">បានបញ្ជាក់</span> <span class="count" id="countConfirmed">0</span>
    </div>
    <div class="status-tab" data-status="paid">
      <span data-i18n="paid">បានបង់</span> <span class="count" id="countPaid">1</span>
    </div>
    <div class="status-tab" data-status="shipped">
      <span data-i18n="shipped">កំពុងដឹក</span> <span class="count" id="countShipped">1</span>
    </div>
    <div class="status-tab" data-status="completed">
      <span data-i18n="completed">បានបញ្ចប់</span> <span class="count" id="countCompleted">1</span>
    </div>
  </div>

  <div class="order-list" id="orderList"></div>

  <div class="empty-state hidden" id="emptyState">
    <div class="icon">📋</div>
    <p data-i18n="noOrders">គ្មានការបញ្ជាទិញ</p>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a class="nav-item" href="01-home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="navHome">ទំព័រដើម</span>
    </a>
    <a class="nav-item" href="01-home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span data-i18n="navCat">ប្រភេទ</span>
    </a>
    <a class="nav-item" href="03-cart.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      <span data-i18n="navCart">កន្ត្រក</span>
    </a>
    <a class="nav-item active" href="06-orders.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="18" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span data-i18n="navOrders">ការបញ្ជាទិញ</span>
    </a>
    <a class="nav-item" href="07-profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="navProfile">ខ្ញុំ</span>
    </a>
  </nav>

  <script>
    let currentLang = 'km';
    let activeTab = 'all';

    const I18N = {
      title: { km: 'ការបញ្ជាទិញរបស់ខ្ញុំ', zh: '我的订单', en: 'My Orders' },
      all: { km: 'ទាំងអស់', zh: '全部', en: 'All' },
      pending: { km: 'មិនទាន់បង់', zh: '待付款', en: 'Pending' },
      paid: { km: 'បានបង់', zh: '已付款', en: 'Paid' },
      shipped: { km: 'កំពុងដឹក', zh: '已发货', en: 'Shipped' },
      completed: { km: 'បានបញ្ចប់', zh: '已完成', en: 'Done' },
      noOrders: { km: 'គ្មានការបញ្ជាទិញ', zh: '暂无订单', en: 'No orders' },
      cancelOrder: { km: 'លុបចោល', zh: '取消', en: 'Cancel' },
      payNow: { km: 'បង់ឥឡូវ', zh: '去支付', en: 'Pay' },
      confirmReceived: { km: 'បញ្ជាក់ទទួល', zh: '确认收货', en: 'Confirm receipt' },
      confirmed: { km: 'បានបញ្ជាក់', zh: '已确认', en: 'Confirmed' },
      cancelled: { km: 'ការបញ្ជាទិញត្រូវបានលុបចោល', zh: '订单已取消', en: 'Order cancelled' },
      navHome: { km: 'ទំព័រដើម', zh: '首页', en: 'Home' },
      navCat: { km: 'ប្រភេទ', zh: '分类', en: 'Category' },
      navCart: { km: 'កន្ត្រក', zh: '购物车', en: 'Cart' },
      navOrders: { km: 'ការបញ្ជាទិញ', zh: '订单', en: 'Orders' },
      navProfile: { km: 'ខ្ញុំ', zh: '我的', en: 'Me' },
    };

    let orders = JSON.parse(localStorage.getItem('tgm_orders') || '[]');
    // Demo orders if empty
    if (orders.length === 0) {
      orders = [
        { id: 'ORD-20260605-A1B2C3', items: [{ name: 'Pure Cotton T-Shirt', spec: 'White / M', qty: 2, price: 12.99, img: '👕' }, { name: 'Bluetooth Earbuds', spec: 'Black', qty: 1, price: 18.99, img: '🎧' }], total: 65.98, status: 'pending_payment', createdAt: '2026-06-05 14:30' },
        { id: 'ORD-20260604-D4E5F6', items: [{ name: 'SPF50 Sunscreen', spec: '50ml', qty: 1, price: 9.99, img: '☀️' }], total: 11.99, status: 'paid', createdAt: '2026-06-04 10:15', paidAt: '2026-06-04 10:20' },
        { id: 'ORD-20260602-G7H8I9', items: [{ name: 'Khmer Cushion', spec: 'Blue', qty: 2, price: 15.00, img: '🛋️' }, { name: 'Bamboo Lamp', spec: 'Natural', qty: 1, price: 19.99, img: '💡' }], total: 51.99, status: 'shipped', createdAt: '2026-06-02 08:00', shipping: { company: 'J&T Express', tracking: 'JT987654321' } },
        { id: 'ORD-20260528-J1K2L3', items: [{ name: 'Leather Backpack', spec: 'Brown', qty: 1, price: 45.00, img: '🎒' }], total: 47.00, status: 'completed', createdAt: '2026-05-28 16:45', completedAt: '2026-06-01 09:20' },
      ];
      localStorage.setItem('tgm_orders', JSON.stringify(orders));
    }

    function switchLang(lang) {
      currentLang = lang;
      document.body.className = '';
      if (lang === 'km') document.body.classList.add('lang-km');
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[key] && I18N[key][lang]) el.textContent = I18N[key][lang];
      });
      document.querySelectorAll('.lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
      renderOrders();
    }

    document.getElementById('langSwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      switchLang(btn.dataset.lang);
    });

    // Tab switching
    document.getElementById('statusTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.status-tab');
      if (!tab) return;
      activeTab = tab.dataset.status;
      document.querySelectorAll('.status-tab').forEach(t => t.classList.toggle('active', t === tab));
      renderOrders();
    });

    function renderOrders() {
      const filtered = activeTab === 'all' ? orders : orders.filter(o => o.status === activeTab);
      const list = document.getElementById('orderList');
      const empty = document.getElementById('emptyState');

      // Update counts
      document.getElementById('countAll').textContent = orders.length;
      document.getElementById('countPending').textContent = orders.filter(o => o.status === 'pending_payment').length;
      document.getElementById('countConfirmed').textContent = orders.filter(o => o.status === 'confirmed').length;
      document.getElementById('countPaid').textContent = orders.filter(o => o.status === 'paid').length;
      document.getElementById('countShipped').textContent = orders.filter(o => o.status === 'shipped').length;
      document.getElementById('countCompleted').textContent = orders.filter(o => o.status === 'completed').length;

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const statusLabels = {
        pending_payment: currentLang === 'km' ? 'មិនទាន់បង់' : currentLang === 'zh' ? '待付款' : 'Pending',
        confirmed: currentLang === 'km' ? 'បានបញ្ជាក់' : currentLang === 'zh' ? '已确认' : 'Confirmed',
        paid: currentLang === 'km' ? 'បានបង់' : currentLang === 'zh' ? '已付款' : 'Paid',
        shipped: currentLang === 'km' ? 'កំពុងដឹក' : currentLang === 'zh' ? '已发货' : 'Shipped',
        completed: currentLang === 'km' ? 'បានបញ្ចប់' : currentLang === 'zh' ? '已完成' : 'Completed',
        cancelled: currentLang === 'km' ? 'បានលុបចោល' : currentLang === 'zh' ? '已取消' : 'Cancelled',
      };

      list.innerHTML = filtered.map(order => `
        <div class="order-card">
          <div class="order-header">
            <span class="order-id">${order.id}</span>
            <span class="order-status status-${order.status}">${statusLabels[order.status]}</span>
          </div>
          <div class="order-items">
            ${order.items.map(item => `
              <div class="order-item">
                <div class="order-item-img">${item.img || '📦'}</div>
                <div class="order-item-info">
                  <div class="order-item-name">${item.name}</div>
                  <div class="order-item-spec">${item.spec || ''} × ${item.qty}</div>
                </div>
                <div class="order-item-price">$${(item.price * item.qty).toFixed(2)}</div>
              </div>
            `).join('')}
          </div>
          <div class="order-footer">
            <span class="order-total">$${order.total.toFixed(2)}</span>
            <div class="order-actions">
              ${order.status === 'pending_payment' ? `
                <button class="order-btn btn-danger-o" onclick="cancelOrder('${order.id}')">${I18N.cancelOrder[currentLang]}</button>
                <button class="order-btn btn-fill" onclick="payOrder('${order.id}')">${I18N.payNow[currentLang]}</button>
              ` : ''}
              ${order.status === 'shipped' ? `
                <button class="order-btn btn-fill" onclick="confirmOrder('${order.id}')">${I18N.confirmReceived[currentLang]}</button>
              ` : ''}
              ${order.shipping ? `<span style="font-size:11px;color:var(--muted)">🚚 ${order.shipping.company}: ${order.shipping.tracking}</span>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    function cancelOrder(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        order.status = 'cancelled';
        localStorage.setItem('tgm_orders', JSON.stringify(orders));
        showToast(I18N.cancelled[currentLang]);
        renderOrders();
      }
    }

    function payOrder(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        localStorage.setItem('tgm_current_order', JSON.stringify(order));
        window.location = '05-payment.html';
      }
    }

    function confirmOrder(id) {
      const order = orders.find(o => o.id === id);
      if (order) {
        order.status = 'completed';
        order.completedAt = new Date().toISOString();
        localStorage.setItem('tgm_orders', JSON.stringify(orders));
        showToast(I18N.confirmed[currentLang]);
        renderOrders();
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    renderOrders();
  </script>
</body>
</html>
