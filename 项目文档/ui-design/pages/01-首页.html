<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>TG Mall — ទំព័រដើម</title>
  <style>
    /* ============================================================
       Design tokens — Modern minimal + Cambodia gold/red
       ============================================================ */
    :root {
      --bg:        oklch(98.5% 0.003 95);
      --surface:   oklch(100% 0 0);
      --fg:        oklch(20% 0.015 80);
      --muted:     oklch(50% 0.012 80);
      --border:    oklch(90% 0.005 95);
      --accent:    oklch(64% 0.16 82);
      --accent-red: oklch(52% 0.20 24);
      --accent-green: oklch(58% 0.16 155);
      --accent-blue: oklch(58% 0.16 255);
      --font-khmer: 'Noto Sans Khmer', 'Khmer OS', system-ui, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 1px 3px oklch(0% 0 0 / 0.06);
      --shadow-float: 0 4px 16px oklch(0% 0 0 / 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--fg);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 72px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* When Khmer is active, switch body font */
    body.lang-km { font-family: var(--font-khmer); }
    body.lang-km .price-usd { font-family: var(--font-body); }

    /* ============================================================
       Top header — search + language
       ============================================================ */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-header .logo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 19px;
      color: var(--accent);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .search-bar {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color 0.15s;
    }
    .search-bar:hover { border-color: var(--accent); }
    .search-bar svg { flex-shrink: 0; opacity: 0.4; }
    .search-bar span {
      font-size: 14px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lang-switch {
      display: flex;
      gap: 2px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 2px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .lang-switch button {
      width: 34px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.15s;
      font-family: var(--font-body);
    }
    .lang-switch button.active {
      background: var(--accent);
      color: #fff;
    }

    /* ============================================================
       Banner carousel
       ============================================================ */
    .banner-wrap {
      margin: 12px 16px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      aspect-ratio: 16/7;
      background: oklch(95% 0.008 85);
    }
    .banner-track {
      display: flex;
      height: 100%;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    }
    .banner-slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }
    .banner-slide:nth-child(1) {
      background: linear-gradient(135deg, oklch(64% 0.16 82), oklch(52% 0.20 24));
    }
    .banner-slide:nth-child(2) {
      background: linear-gradient(135deg, oklch(55% 0.15 240), oklch(45% 0.18 260));
    }
    .banner-slide:nth-child(3) {
      background: linear-gradient(135deg, oklch(58% 0.16 155), oklch(48% 0.14 170));
    }
    .banner-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
    }
    .banner-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transition: all 0.3s;
    }
    .banner-dots span.active { background: #fff; width: 18px; border-radius: 3px; }

    /* ============================================================
       Category chips
       ============================================================ */
    .category-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 16px 12px;
    }

    .cat-chip {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      color: var(--muted);
    }
    .cat-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .cat-chip:active { transform: scale(0.96); }

    /* ============================================================
       Section header
       ============================================================ */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 16px 10px;
    }
    .section-header h2 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .section-header a {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    /* ============================================================
       Product grid (2 columns)
       ============================================================ */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 16px 16px;
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform 0.15s;
      border: 1px solid var(--border);
    }
    .product-card:active { transform: scale(0.98); }
    .product-card .img-wrap {
      aspect-ratio: 1;
      background: oklch(96% 0.003 90);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      position: relative;
      overflow: hidden;
    }
    .product-card .img-wrap .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent-red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }
    .product-card .info {
      padding: 10px 10px 12px;
    }
    .product-card .name {
      font-size: 13px;
      line-height: 1.4;
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .product-card .prices {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .product-card .price-usd {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent-red);
      letter-spacing: -0.02em;
    }
    .product-card .price-khr {
      font-size: 11px;
      color: var(--muted);
    }

    /* ============================================================
       Skeleton loading
       ============================================================ */
    .skeleton-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .skeleton-img {
      aspect-ratio: 1;
      background: oklch(94% 0.002 90);
      animation: shimmer 1.5s infinite;
    }
    .skeleton-text {
      height: 14px;
      background: oklch(94% 0.002 90);
      border-radius: 4px;
      margin: 10px 10px 4px;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-text.short { width: 60%; }
    @keyframes shimmer {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* ============================================================
       Bottom navigation
       ============================================================ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(430px, 100%);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 6px 0 env(safe-area-inset-bottom, 8px);
      z-index: 200;
    }
    .bottom-nav .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 0;
      cursor: pointer;
      color: var(--muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      transition: color 0.15s;
      position: relative;
    }
    .bottom-nav .nav-item.active { color: var(--accent); }
    .bottom-nav .nav-item svg { width: 22px; height: 22px; }
    .bottom-nav .nav-item .badge-dot {
      position: absolute;
      top: 2px;
      right: calc(50% - 18px);
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      background: var(--accent-red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    /* ============================================================
       Toast
       ============================================================ */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: oklch(20% 0.02 80);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Utility */
    .hidden { display: none !important; }
  </style>
</head>

  <script>

    // Product data — realistic Cambodia marketplace items

    let cartCount = 3; // Demo cart count

    function t(key) {
      return (I18N[key] && I18N[key][currentLang]) || key;
    }

    function switchLang(lang) {
      currentLang = lang;
      document.body.className = '';
      if (lang === 'km') document.body.classList.add('lang-km');
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[key] && I18N[key][lang]) {
          el.textContent = I18N[key][lang];
        }
      });
      document.querySelectorAll('.lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
      });
      renderProducts(currentCat);
    }

    // Language switch buttons
    document.getElementById('langSwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      switchLang(btn.dataset.lang);
    });

    // ============================================================
    // Banner carousel
    // ============================================================
    let bannerIdx = 0;
    const bannerTrack = document.getElementById('bannerTrack');
    const bannerDots = document.getElementById('bannerDots');
    const totalBanners = 3;

    function goBanner(i) {
      bannerIdx = i;
      bannerTrack.style.transform = `translateX(-${bannerIdx * 100}%)`;
      bannerDots.querySelectorAll('span').forEach((d, j) => d.classList.toggle('active', j === bannerIdx));
    }

    setInterval(() => goBanner((bannerIdx + 1) % totalBanners), 4000);
    bannerDots.querySelectorAll('span').forEach((d, i) => {
      d.addEventListener('click', () => goBanner(i));
    });

    // Swipe support for banner
    let touchStartX = 0;
    bannerTrack.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    bannerTrack.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (dx < -40) goBanner((bannerIdx + 1) % totalBanners);
      if (dx > 40) goBanner((bannerIdx - 1 + totalBanners) % totalBanners);
    });

    // ============================================================
    // Category filter
    // ============================================================
    let currentCat = 'all';

    document.getElementById('categoryRow').addEventListener('click', (e) => {
      const chip = e.target.closest('.cat-chip');
      if (!chip) return;
      currentCat = chip.dataset.cat;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.toggle('active', c === chip));
      renderProducts(currentCat);
    });

    // ============================================================
    // Render products
    // ============================================================
    function renderProducts(cat) {
      const grid = document.getElementById('productGrid');
      const filtered = cat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat);
      const lang = currentLang;

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">— ${lang === 'km' ? 'គ្មានទំនិញ' : lang === 'zh' ? '暂无商品' : 'No products'} —</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card" onclick="addToCart(${p.id}, '${p.name[currentLang].replace(/'/g, "\\'")}')">
          <div class="img-wrap">
            <span style="font-size:44px">${p.img}</span>
            ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
          </div>
          <div class="info">
            <div class="name">${p.name[lang]}</div>
            <div class="prices">
              <span class="price-usd">$${p.priceUsd.toFixed(2)}</span>
              <span class="price-khr">${p.priceKhr}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ============================================================
    // Cart
    // ============================================================
    function addToCart(id, name) {
      cartCount++;
      updateCartBadge();
      showToast(t('addToCart'));
      // Persist to localStorage
      const cart = JSON.parse(localStorage.getItem('tgm_cart') || '[]');
      const existing = cart.find(i => i.id === id);
      if (existing) { existing.qty++; }
      else { cart.push({ id, qty: 1 }); }
      localStorage.setItem('tgm_cart', JSON.stringify(cart));
    }

    function updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      if (cartCount > 0) {
        badge.classList.remove('hidden');
        badge.textContent = cartCount;
      } else {
        badge.classList.add('hidden');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // Initialize
    renderProducts('all');
    updateCartBadge();

    // Restore cart from localStorage
    const savedCart = JSON.parse(localStorage.getItem('tgm_cart') || '[]');
    cartCount = savedCart.reduce((sum, i) => sum + i.qty, 0);
    updateCartBadge();
  </script>
</body>
</html>
